name: JobFather Daily UX Circulars

on:
  schedule:
    # Runs everyday at 8:30 AM Bangladesh Time (2:30 AM UTC)
    - cron: '30 2 * * *'
  workflow_dispatch: # Allows manual one-click trigger anytime from GitHub

jobs:
  run-jobfather:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r jobfinder/requirements.txt

      - name: Run Unit Tests
        run: |
          python -m unittest discover tests

      - name: Run JobFather Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python jobfinder/jobfather.py

      - name: Save deduplication memory database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jobfinder/seen_jobs.json
          git commit -m "chore: update seen_jobs memory database [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push
